<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>TemplateMeva - Premium Blogger Templates Store</title>
    <meta name="title" content="TemplateMeva - Premium Blogger Templates Store" />
    <meta name="description" content="Discover responsive, SEO-optimized Blogger (Blogspot) templates for publishers. Free editions, one-time activation, clean XML, and no encrypted scripts." />
    <meta name="keywords" content="blogger templates, blogspot themes, magazine blogger template, llianmeva blogger template, city politics blogger theme, free blogger template, adsense ready templates" />
    <meta name="author" content="TemplateMeva" />
    <meta name="theme-color" content="#4F46E5" />

    <!-- Canonical (SPA routes are rewritten client-side; the store root is canonical) -->
    <link rel="canonical" href="https://templatemeva.pages.dev/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TemplateMeva" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://templatemeva.pages.dev/" />
    <meta property="og:title" content="TemplateMeva - Premium Blogger Templates Store" />
    <meta property="og:description" content="Turn your free Google Blogspot blog into a professional publication with clean, human-readable XML templates." />
    <meta property="og:image" content="https://templatemeva.pages.dev/images/llianmeva-preview.png" />
    <meta property="og:image:alt" content="TemplateMeva — premium Blogger template store" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@templatemeva" />
    <meta name="twitter:url" content="https://templatemeva.pages.dev/" />
    <meta name="twitter:title" content="TemplateMeva - Premium Blogger Templates Store" />
    <meta name="twitter:description" content="Responsive, SEO-optimized Google Blogger templates with free editions and one-time activation." />
    <meta name="twitter:image" content="https://templatemeva.pages.dev/images/llianmeva-preview.png" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TemplateMeva",
      "url": "https://templatemeva.pages.dev",
      "description": "Premium Google Blogger Templates Store for publishers: free editions, one-time activation, responsive layouts and clean human-readable XML.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://templatemeva.pages.dev/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
